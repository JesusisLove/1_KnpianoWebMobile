<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Fragments</title>
    <style>
        .column-control {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 4px;
            margin-bottom: 6px;
        }
        .column-control > button { flex-shrink: 0; }
        .column-menu {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
        }
        .column-menu label {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            padding: 2px 4px;
        }
        .column-menu label:hover {
            background-color: #f5f5f5;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <div th:fragment="unPaidFeeTable(stuid, stuName)">
        <!-- 列控制按钮和菜单 -->
        <div class="column-control">
            <button class="btn btn-sm btn-secondary" style="pointer-events:none;">
                显示/隐藏列
            </button>
            <div class="column-menu">
                <label>
                    <input type="checkbox" checked onchange="toggleColumn('col-lsnFeeId')" /> 课费编号
                </label>
                <label>
                    <input type="checkbox" checked onchange="toggleColumn('col-stuId')" /> 学生编号
                </label>
                <label>
                    <input type="checkbox" checked onchange="toggleColumn('col-subjectId')" /> 科目编号
                </label>
                <label>
                    <input type="checkbox" checked onchange="toggleColumn('col-subjectName')" /> 科目名称
                </label>
                <label>
                    <input type="checkbox" checked onchange="toggleColumn('col-lsnCount')" /> 课数
                </label>
                <label>
                    <input type="checkbox" checked onchange="toggleColumn('col-lessonType')" /> 课程属性
                </label>
                <label>
                    <input type="checkbox" checked onchange="toggleColumn('col-lsnMonth')" /> 上课月份
                </label>
                <label>
                    <input type="checkbox" checked onchange="toggleColumn('col-lsnFee')" /> 未结算金额
                </label>
                <label>
                    <input type="checkbox" checked onchange="toggleColumn('col-ownFlg')" /> 结算状态
                </label>
                <label>
                    <input type="checkbox" checked onchange="toggleColumn('col-payStyle')" /> 结算方式
                </label>
                <label>
                    <input type="checkbox" checked onchange="toggleColumn('col-payMonth')" /> 结算月
                </label>
            </div>
        </div>

        <div th:id="${stuid}" class="tab-pane fade" th:classappend="'show active'" style="overflow-x: auto; max-width: 100%;">
            <table class="table styled-table table-sm">
                <thead>
                    <tr>
                        <th class="col-lsnFeeId">课费编号</th>
                        <th class="col-stuId">学生编号</th>
                        <th class="col-subjectId">科目编号</th>
                        <th class="col-subjectName">科目名称</th>
                        <th class="col-lsnCount">课数</th>
                        <th class="col-lessonType">课程属性</th>
                        <th class="col-lsnMonth">上课月份</th>
                        <th class="col-lsnFee">未结算金额</th>
                        <th class="col-ownFlg">结算状态</th>
                        <th class="col-payStyle">结算方式</th>
                        <th class="col-payMonth">结算月</th>
                        <th class="action-column">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="info:${infoList}" th:if="${info.stuName == stuName}"
                        th:class="${info.lessonType == 2 ? 'monthly-extra-row' : ''}">
                        <td class="col-lsnFeeId">[[${info.lsnFeeId}]]</td>
                        <td class="col-stuId">[[${info.stuId}]]</td>
                        <td class="col-subjectId">[[${info.subjectId}]]</td>
                        <td class="col-subjectName">[[${info.subjectName}]] （[[${info.subjectSubName}]]）</td>
                        <td class="col-lsnCount">[[${info.lsnCount}]]</td>
                        <td class="col-lessonType">
                            <span th:if="${info.lessonType == 0}" class="status-badge status-course-settle">课结算</span>
                            <span th:if="${info.lessonType == 1}" class="status-badge status-month-plan">月计划</span>
                            <span th:if="${info.lessonType == 2}" class="status-badge status-month-extra">月加课</span>
                        </td>
                        <td class="col-lsnMonth">[[${info.lsnMonth}]]</td>
                        <td class="col-lsnFee amount-display">¥[[${info.lsnFee}]]</td>
                        <td class="col-ownFlg">
                            <span th:if="${info.ownFlg == 0}" class="status-badge status-unpaid">未支付</span>
                            <span th:if="${info.ownFlg != 0}" class="status-badge status-paid">已支付</span>
                        </td>
                        <td class="col-payStyle">
                            <span th:if="${info.payStyle == 0}" class="status-badge status-course-pay">课支付</span>
                            <span th:if="${info.payStyle != 0}" class="status-badge status-month-pay">月支付</span>
                        </td>
                        <td class="col-payMonth">[[${info.lsnMonth}]]</td>
                        <td class="action-column">
                            <a class="btn btn-primary d-block mb-1"
                                th:href="@{/kn_lsn_unpaid_001/{lsnFeeId}(lsnFeeId=${info.lsnFeeId})}"
                                methods="GET">💰 学费精算</a>
                            <button th:if="${info.ownFlg == 0}"
                                type="button"
                                class="btn btn-danger d-block bad-debt-btn"
                                th:data-lsnfeeid="${info.lsnFeeId}"
                                th:data-subjectname="${info.subjectName}"
                                th:data-lsnmonth="${info.lsnMonth}">💸 坏账处理</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 删除处理的表单提交 -->
        <form id="deleteSubjectForm" action="" method="post">
            <input type="hidden" name="_method" value="Delete" />
        </form>

        <!-- 列控制相关的 JavaScript -->
        <script th:inline="javascript">
            // 存储列显示状态
            var columnStates = JSON.parse(localStorage.getItem('unpaidColumnStates') || '{}');

            // 控制列的显示/隐藏（同步到所有Tab）
            function toggleColumn(columnClass) {
                // 更新状态
                columnStates[columnClass] = !columnStates[columnClass];
                const isVisible = columnStates[columnClass];

                // 更新所有具有该类名的元素
                const cells = document.getElementsByClassName(columnClass);
                Array.from(cells).forEach(cell => {
                    cell.style.display = isVisible ? '' : 'none';
                });

                // 保存状态
                localStorage.setItem('unpaidColumnStates', JSON.stringify(columnStates));

                // 同步所有Tab中的复选框状态
                const checkboxes = document.querySelectorAll(`input[onchange="toggleColumn('${columnClass}')"]`);
                checkboxes.forEach(checkbox => {
                    checkbox.checked = isVisible;
                });
            }

            // 应用保存的列状态
            function applyColumnStates() {
                Object.entries(columnStates).forEach(([columnClass, isVisible]) => {
                    const cells = document.getElementsByClassName(columnClass);
                    Array.from(cells).forEach(cell => {
                        cell.style.display = isVisible ? '' : 'none';
                    });

                    // 更新复选框状态
                    const checkboxes = document.querySelectorAll(`input[onchange="toggleColumn('${columnClass}')"]`);
                    checkboxes.forEach(checkbox => {
                        checkbox.checked = isVisible;
                    });
                });
            }

            // 页面加载时初始化列状态
            document.addEventListener('DOMContentLoaded', function () {
                applyColumnStates();
            });

            // 监听Tab切换事件
            document.addEventListener('shown.bs.tab', function () {
                applyColumnStates();
            });
        </script>
    </div>
</body>

</html>
